name: Listen to stations

on:
  schedule:
    - cron: "47 */3 * * *"    # every 3 hours
  workflow_dispatch: {}       # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: catalog-repo         # never at the same time as the catalogue build (both commit)
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What is playing now
        run: python listen.py
      - name: Save
        run: |
          git config user.name "dopecast-bot"
          git config user.email "dopecast-bot@users.noreply.github.com"
          git add listen
          git diff --cached --quiet || git commit -m "Listening $(date -u +%F\ %H:%M)"
          git pull --rebase
          git push
