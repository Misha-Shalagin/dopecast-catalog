name: Station catalogue

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check streams and build catalog.json
        run: python build_catalog.py
      - name: Publish if changed
        run: |
          git config user.name "dopecast-bot"
          git config user.email "dopecast-bot@users.noreply.github.com"
          git add catalog.json listen/pool.json
          git diff --cached --quiet || git commit -m "Catalogue $(date -u +%F)"
          git pull --rebase
          git push
